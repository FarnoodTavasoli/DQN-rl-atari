# =============================================================================
# Atari DQN Benchmark — Central Hyperparameter Configuration
# =============================================================================
# All training flags, network settings, and I/O paths live here.
# Command-line arguments in train.py can override any value at runtime.
# =============================================================================

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
env_id: "ALE/Freeway-v5"        # Any ALE/gymnasium Atari environment ID
n_envs: 16                         # Parallel environments, run via SubprocVecEnv
                                   # (one OS process each). Tuned for a ~12-core CPU:
                                   # keeps the GPU fed with fresh transitions instead
                                   # of stalling on single-env stepping. buffer_size
                                   # below has been sized to still hold a large window
                                   # of history even at this collection rate.
frame_stack: 4                    # Consecutive frames stacked as one observation
seed: 42                          # Global random seed for reproducibility
n_eval_episodes: 22   # Episodes averaged per EvalCallback evaluation during
                       # training, used to pick best_model.zip. Higher = less
                       # noisy best-checkpoint selection, at the cost of more
                       # wall-clock time spent evaluating instead of training
                       # (eval_freq below is already reduced 5x specifically
                       # to keep total eval time bounded -- see bug #5 in
                       # project history). Try 25-30 for games with high
                       # per-episode score variance (e.g. Space Invaders).


# ---------------------------------------------------------------------------
# Core Hyperparameters  (DeepMind Nature DQN defaults as baseline)
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Optimizer
# ---------------------------------------------------------------------------
# Choices and their recommended learning rates:
#
#   adam    — Adaptive moment estimation. Robust default for DQN.
#               Typical LR: 1e-4 – 2.5e-4
#
#   adamw   — Adam with decoupled weight decay. Slightly better regularisation.
#               Typical LR: 1e-4 – 2.5e-4
#
#   rmsprop — Used in the original DeepMind Nature DQN paper.
#               Typical LR: 2.5e-4 – 1e-3
#
#   sgd     — Vanilla SGD with momentum. Rarely used for DQN; needs careful tuning.
#               Typical LR: 1e-3 – 1e-2
#
# optimizer_kwargs overrides or extends the built-in defaults for the chosen
# optimizer (e.g. eps, alpha, momentum, weight_decay).
optimizer: "adam"
optimizer_kwargs: {eps : 1.5e-4}              # e.g. {eps: 1.5e-4} to override Adam eps
reward_clip_mode: "sign"    # "sign" (original clip) | "scaled_log" | "none"

lr_schedule: "constant"             # "linear" anneals learning_rate → 10% of itself over training;
                                  # "constant" keeps the old flat-LR behavior
learning_rate: 1.0e-4             # Learning rate passed to the optimizer
batch_size: 32                    # Mini-batch size drawn from replay buffer.
                                   # Bumped from 32 → 128: a GTX 1650 barely notices
                                   # the extra compute for a small NatureCNN, so a
                                   # bigger batch means more GPU work per gradient
                                   # step instead of leaving it idle between updates.
buffer_size: 1000000                # Replay buffer capacity. Paired with
                                   # optimize_memory_usage=True (agent.py) this stores
                                   # obs once instead of duplicating obs/next_obs, so
                                   # 200k transitions costs ~5.6 GB in ONE contiguous
                                   # array. Windows must commit that whole block up
                                   # front (no lazy overcommit like Linux), and each of
                                   # the 8 SubprocVecEnv workers also loads a full
                                   # torch/gymnasium/ALE stack (~0.5-1 GB each) before
                                   # the buffer is even created. 400k (~10.5 GB) reliably
                                   # failed with an ArrayMemoryError under that combined
                                   # load — if you still hit an allocation error, lower
                                   # this further (e.g. 100000) or reduce n_envs.
optimize_memory_usage: false        # Halves replay-buffer RAM by storing next_obs as
                                   # a view into the obs ring buffer. Required to make
                                   # buffer_size above fit in 16 GB of RAM.
gamma: 0.99                        # Discount factor γ (standard Atari value; 0.999 is
                                   # too high and causes training instability)
tau: 1.0                          # Target-network update coefficient (1.0 = hard copy)
target_update_interval: 10000      # Steps between target-network syncs
train_freq: 4
gradient_steps: 2                 # Matches n_envs=16 to preserve the same
                                   # updates-per-transition ratio validated
                                   # earlier (4 updates / 64 transitions).
                                   #
learning_starts: 85000            # Random-play warm-up steps before first update

max_grad_norm: 10.0               # Gradient clipping threshold

# ---------------------------------------------------------------------------
# Exploration Schedule  (linear ε-greedy annealing)
# ---------------------------------------------------------------------------
exploration_fraction: 0.35        # Decay ε over the first 15% of steps
exploration_initial_eps: 1.0      # Starting ε (fully random)
exploration_final_eps: 0.02       # Final ε (nearly greedy)
exploration_persistence_mean: 3.0  # Mean consecutive exploratory steps a random

                                    # action is held for (PersistentExplorationMixin
                                    # in agent.py). 1.0 = original per-step-independent
                                    # epsilon-greedy. Try 6-10 to test whether sustained
                                    # random actions help discover ladder-climbing
                                    # (DonkeyKong) or fork-holding (Riverraid).
n_steps: 4                          # >1 enables n-step returns (SB3's built-in NStepReplayBuffer, v2.7.0+).
                                    # Backs up the TD target over n consecutive env steps instead of 1,
                                    # letting a good trajectory's reward propagate through the value
                                    # function in one update instead of needing n sequential 1-step
                                    # bootstraps -- directly useful once persistent exploration starts
                                    # finding good rollouts (ladder climbs, held lanes at forks) that
                                    # currently need many updates to get credited. Requires
exploration_action_weights:
  UP: 4.0   # bias random exploration toward attempting climbs.
            # Leave unset for games that don't need this.

# ---------------------------------------------------------------------------
# Training Budget
# ---------------------------------------------------------------------------
total_timesteps: 30000000           # 1 million steps — ~1 h per algorithm on GTX 1650
checkpoint_interval: 5000000        # Save model weights every 50k steps

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
log_dir: "logs"                   # TensorBoard root  → logs/<env>/<algo>_<hparams>/
checkpoint_dir: "checkpoints"     # Checkpoint root   → checkpoints/<env>/<algo>/
video_dir: "videos"               # Evaluation video recordings
